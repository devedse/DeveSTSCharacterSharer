name: GitHubActionsBuilds

on:
  push:
  workflow_dispatch:

jobs:
  generate_version_number:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      build_number: ${{ steps.buildnumber.outputs.build_number }}
    steps:
    - name: Generate build number
      id: buildnumber
      uses: onyxmueller/build-tag-number@v1
      with:
        token: ${{secrets.github_token}}

  build_docker:
    needs: generate_version_number
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v7
    - name: Login to GitHub Container Registry
      if: github.actor != 'dependabot[bot]'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Set up QEMU
      id: qemu
      uses: docker/setup-qemu-action@v4
      with:
        image: tonistiigi/binfmt:latest
        platforms: all
    - name: Available platforms
      run: echo ${{ steps.qemu.outputs.platforms }}
    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@v4
    - name: Builder instance name
      run: echo ${{ steps.buildx.outputs.name }}
    - name: Available platforms
      run: echo ${{ steps.buildx.outputs.platforms }}
    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/devedse/devestscharactersharer
        tags: |
          type=raw,value=1.0.${{needs.generate_version_number.outputs.build_number}},enable=${{ github.ref == 'refs/heads/master' }}
          type=raw,value=1.0.${{needs.generate_version_number.outputs.build_number}}-beta,enable=${{ github.ref != 'refs/heads/master' }}
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
          type=ref,event=branch,prefix=beta_,enable=${{ github.ref != 'refs/heads/master' }}
          type=raw,value=beta_nightly,enable=${{ github.actor != 'dependabot[bot]' }}
        labels: |
          maintainer=${{ github.actor }}
          org.opencontainers.image.description=DeveSTSCharacterSharer - Share Slay the Spire 2 characters with friends
        annotations: |
          org.opencontainers.image.description=DeveSTSCharacterSharer - Share Slay the Spire 2 characters with friends
      env:
        DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: Dockerfile
        platforms: linux/amd64,linux/arm64
        push: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        annotations: ${{ steps.meta.outputs.annotations }}
        build-args: |
          BUILD_VERSION=1.0.${{needs.generate_version_number.outputs.build_number}}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        provenance: false
        sbom: false

  build_linux:
    needs: generate_version_number
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: dotnet restore
      run: dotnet restore DeveSTSCharacterSharer.slnx
    - name: dotnet build
      run: dotnet build DeveSTSCharacterSharer.slnx -c Release --no-restore /p:Version=1.0.${{needs.generate_version_number.outputs.build_number}}
    - name: dotnet test
      run: dotnet test DeveSTSCharacterSharer.slnx -c Release --no-build --verbosity normal

  build_linux_with_sonarqube:
    needs: generate_version_number
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - uses: actions/setup-java@v6
      with:
        distribution: 'zulu'
        java-version: '21' # The JDK version to make available on the path.
        java-package: jdk # (jre, jdk, or jdk+fx) - defaults to jdk
        architecture: x64 # (x64 or x86) - defaults to x64
    - name: Install tools
      run: dotnet tool install --global dotnet-sonarscanner
    - name: dotnet restore
      run: dotnet restore DeveSTSCharacterSharer.slnx
    - name: SonarQube begin
      if: github.actor != 'dependabot[bot]'
      run: dotnet-sonarscanner begin /k:"DeveSTSCharacterSharer" /o:"devedse-github" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.token=${{secrets.SONARQUBETOKEN}} /d:sonar.cs.opencover.reportsPaths="tests/DeveSTSCharacterSharer.Tests/TestResults/*/coverage.opencover.xml" /d:sonar.coverage.exclusions="tests/**/*.cs"
    - name: dotnet build
      run: dotnet build DeveSTSCharacterSharer.slnx -c Release --no-restore /p:Version=1.0.${{needs.generate_version_number.outputs.build_number}}
    - name: dotnet test
      run: dotnet test DeveSTSCharacterSharer.slnx --verbosity normal --no-build -c Release --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura,opencover
    - name: SonarQube end
      if: github.actor != 'dependabot[bot]'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: dotnet-sonarscanner end /d:sonar.token=${{secrets.SONARQUBETOKEN}}
    - name: Run CodeCov
      if: github.actor != 'dependabot[bot]'
      uses: codecov/codecov-action@v7
      with:
        directory: ./tests/DeveSTSCharacterSharer.Tests/TestResults
        fail_ci_if_error: true # optional (default = false)
        verbose: true # optional (default = false)
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Publish
      run: dotnet publish src/DeveSTSCharacterSharer/DeveSTSCharacterSharer.csproj -c Release -o Scripts/Output/DeveSTSCharacterSharer /p:UseAppHost=false /p:Version=1.0.${{needs.generate_version_number.outputs.build_number}}
    - name: Package DeveSTSCharacterSharer
      run: |
        # Remove existing files if they exist
        rm -f Scripts/Output/DeveSTSCharacterSharer.7z
        rm -f Scripts/Output/DeveSTSCharacterSharer.zip

        # Package the publish output
        cd Scripts/Output/DeveSTSCharacterSharer

        # Create zip file (excluding .pdb files)
        zip -r ../DeveSTSCharacterSharer.zip . -x "*.pdb"

        # Create 7z file (excluding .pdb files)
        7z a -t7z -m0=LZMA2 -mmt=on -mx9 -md=1536m -mfb=273 -ms=on -mqs=on -sccUTF-8 "../DeveSTSCharacterSharer.7z" . -x!"*.pdb"
      shell: bash

    - uses: actions/upload-artifact@v7
      with:
        name: DeveSTSCharacterSharer7z
        path: ./Scripts/Output/DeveSTSCharacterSharer.7z
    - uses: actions/upload-artifact@v7
      with:
        name: DeveSTSCharacterSharerZip
        path: ./Scripts/Output/DeveSTSCharacterSharer.zip

  release_github:
    permissions:
      contents: write
    needs: [generate_version_number, build_linux_with_sonarqube, build_linux, build_docker]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: ./artifacts/

    - name: Display structure of downloaded files
      run: |
        cd ./artifacts/
        ls -R
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: 1.0.${{needs.generate_version_number.outputs.build_number}}
        name: 1.0.${{needs.generate_version_number.outputs.build_number}}
        body: |
          ${{ github.event.head_commit.message }}

          Docker image: `ghcr.io/devedse/devestscharactersharer:1.0.${{needs.generate_version_number.outputs.build_number}}`
        files: |
          ./artifacts/DeveSTSCharacterSharer7z/DeveSTSCharacterSharer.7z
          ./artifacts/DeveSTSCharacterSharerZip/DeveSTSCharacterSharer.zip
        fail_on_unmatched_files: true
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
